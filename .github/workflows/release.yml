name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run self-test
        run: bash verify/selftest.sh

      - name: Build archive
        shell: bash
        run: |
          set -Eeuo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage/vps-init
          rsync -a \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'config.env' \
            ./ dist/stage/vps-init/
          tar -C dist/stage -czf "dist/vps-init-${ver}.tar.gz" vps-init
          (cd dist && sha256sum "vps-init-${ver}.tar.gz" > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/vps-init-${GITHUB_REF_NAME#v}.tar.gz" \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
