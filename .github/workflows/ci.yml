name: Self Test

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run VPS Init self-test
        run: bash verify/selftest.sh
      - name: ShellCheck errors
        run: shellcheck -S error vps-init install.sh lib/*.sh lib/app/*.sh core/*.sh modules/*/*.sh optional/*/*.sh verify/*.sh verify/tests/*.sh
